<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norozz — Translator & Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🌐 Norozz Tools</h1>
        <p>Language Translator + Location & Map</p>
      </header>

      <!-- Tab Switcher -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="translator">🔤 Translator</button>
        <button class="tab-btn" data-tab="map">🗺️ Map & Location</button>
      </div>

      <!-- ═══════════════ TRANSLATOR TAB ═══════════════ -->
      <div class="tab-panel active" id="tab-translator">
        <div class="card">
          <div class="lang-row">
            <div class="lang-group">
              <label for="sourceLang">From</label>
              <select id="sourceLang">
                <option value="en-IN">English</option>
                <option value="hi-IN">Hindi</option>
                <option value="bn-IN">Bengali</option>
                <option value="gu-IN">Gujarati</option>
                <option value="kn-IN">Kannada</option>
                <option value="ml-IN">Malayalam</option>
                <option value="mr-IN">Marathi</option>
                <option value="od-IN">Odia</option>
                <option value="pa-IN">Punjabi</option>
                <option value="ta-IN">Tamil</option>
                <option value="te-IN">Telugu</option>
              </select>
            </div>
            <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
            <div class="lang-group">
              <label for="targetLang">To</label>
              <select id="targetLang">
                <option value="hi-IN">Hindi</option>
                <option value="en-IN">English</option>
                <option value="bn-IN">Bengali</option>
                <option value="gu-IN">Gujarati</option>
                <option value="kn-IN">Kannada</option>
                <option value="ml-IN">Malayalam</option>
                <option value="mr-IN">Marathi</option>
                <option value="od-IN">Odia</option>
                <option value="pa-IN">Punjabi</option>
                <option value="ta-IN">Tamil</option>
                <option value="te-IN">Telugu</option>
              </select>
            </div>
          </div>

          <div class="text-row">
            <div class="text-group">
              <textarea id="inputText" placeholder="Enter text to translate..." maxlength="1000"></textarea>
              <div class="char-count"><span id="charCount">0</span>/1000</div>
            </div>
            <div class="text-group output-group">
              <div id="outputText" class="output-box">
                <span class="placeholder">Translation will appear here...</span>
              </div>
              <button class="copy-btn" id="copyBtn" style="display:none">📋 Copy</button>
            </div>
          </div>

          <button class="translate-btn" id="translateBtn">Translate</button>
          <div id="statusMsg" class="status-msg" style="display:none"></div>
        </div>
      </div>

      <!-- ═══════════════ MAP TAB ═══════════════ -->
      <div class="tab-panel" id="tab-map">
        <div class="card map-card">

          <!-- Address Autocomplete -->
          <div class="map-section">
            <h3>📍 Address Search & Autocomplete</h3>
            <div class="autocomplete-wrap">
              <input
                type="text"
                id="addressInput"
                class="map-input"
                placeholder="Type an address in India..."
                autocomplete="off"
              />
              <div id="suggestions" class="suggestions-list" style="display:none"></div>
            </div>
            <div id="selectedAddress" class="info-box" style="display:none"></div>
          </div>

          <!-- Route Calculator -->
          <div class="map-section">
            <h3>🚗 Route & ETA Calculator</h3>
            <div class="route-inputs">
              <div class="route-field">
                <label>Origin Address</label>
                <div class="autocomplete-wrap">
                  <input type="text" id="originInput" class="map-input" placeholder="Origin address..." autocomplete="off" />
                  <div id="originSuggestions" class="suggestions-list" style="display:none"></div>
                </div>
              </div>
              <div class="route-field">
                <label>Destination Address</label>
                <div class="autocomplete-wrap">
                  <input type="text" id="destInput" class="map-input" placeholder="Destination address..." autocomplete="off" />
                  <div id="destSuggestions" class="suggestions-list" style="display:none"></div>
                </div>
              </div>
            </div>
            <div class="route-actions">
              <button class="map-btn" id="useMyLocationBtn">📡 Use My Location as Origin</button>
              <button class="map-btn primary" id="calcRouteBtn">Calculate Route</button>
            </div>
            <div id="routeResult" class="info-box" style="display:none"></div>
          </div>

          <!-- Map Display -->
          <div class="map-section">
            <h3>🗺️ Map View</h3>
            <div id="map"></div>
            <div class="map-legend">
              <span>🔵 Origin</span>
              <span>🔴 Destination</span>
              <span>🟢 Selected Location</span>
            </div>
          </div>

          <div id="mapStatus" class="status-msg" style="display:none"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script src="map.js"></script>
  </body>
</html>
